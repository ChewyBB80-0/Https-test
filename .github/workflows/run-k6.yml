name: Synthetic k6 Transaction

on:
  # Disabled 2026-08-20. These schedules first reached GitHub in commit
  # 1b7287b and immediately began firing synthetic traffic at the live
  # storefront (k6 hourly, Playwright every 5 min = 288 runs/day). That
  # pollutes the Shopify and Google Analytics data the Search campaign is
  # about to be judged on, and it fails anyway unless the repo secret
  # SYNTHETIC_BASE_URL is set. Re-enable deliberately, not by accident.
  # schedule:
  #   - cron: '0 */1 * * *'
  workflow_dispatch:

jobs:
  run-k6:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run synthetic k6 test
        env:
          BASE_URL: ${{ secrets.SYNTHETIC_BASE_URL }}
          SEARCH_TERM: 'synthetic traffic'
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/scripts" \
            -w /scripts \
            -e BASE_URL="${BASE_URL}" \
            -e SEARCH_TERM="${SEARCH_TERM}" \
            grafana/k6 run synthetic-transaction-k6.js
